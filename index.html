<html lang="en">
  <head>

    <style>
	*{ margin: 0; paddding: 0; box-sizing: border-box; }
    	html, body{ width: 100%; height: 100%; overflow: hidden; position: fixed; }
	model-viewer{ width:100%; height: 100vh; position: absolute; top: 0; left: 0; outline-style: auto; outline-color: black; outline-width: 4px; }
    </style>
  </head>
  <body>
    <!-- <model-viewer> HTML element -->
    <model-viewer id="visor3d" src="" ar ar-modes="webxr scene-viewer quick-look" camera-controls style="width=100%; height:100%">
    </model-viewer>  

    <script src="script.js"></script>
    <!-- Loads <model-viewer> for browsers: -->
