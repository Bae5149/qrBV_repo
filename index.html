<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Visor 3D - Dibujo Tecnico</title>

	<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.2.0/model-viewer.min.js"></script>
	<style>
		body{
			margin: 0;
			padding: 0;
			font-family: 'Segoe UI',Tahoma, Geneva, Verdana, sans-serif;
	}
		model-viewer{
			width: 100%;
			height: 100vh;
			backgroun-color: #f5f5f7
	}
		.ar-button{
			background-color: white;
			border-radius: 4px;
			border: none;
			position: absolute
			bottom: 16px;
			right: 16px;
			padding: 8px 16px;
			font-weight: bold;
			cursor: pointer;
	}
	</style>
</head>
<body>
	<model-viewer
		src="cuerpo001.glb"
		alt="Figura de dibujo tecnico"
		crossorigin="anonymous"
		ar
		ar-modes="webxr scene-viewer quick-look"
		camera-controls
		touch-action="pan-y"
		auto-rotate
		rotation-per-second="15deg"
		enviroment-image="neutral"
		interaction-prompt="auto"
		exposure="1.0"
		shadow-intensity="1"
		style="width:100%; height:100%">
	</model-viewer>

</body>
</html>
