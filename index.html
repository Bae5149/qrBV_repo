<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Visor 3D - Dibujo Tecnico</title>

	<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.2.0/model-viewer.min.js"></script>
	<style>
		body{ margin: 0; padding: 0; overflow: hidden; }
		model-viewer{ width: 100%; height: 100vh; backgroun-color: #f0f0f0 }
	</style>
</head>
<body>
	<model-viewer
		src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
		alt="Figura de dibujo tecnico"
		camera-controls
		touch-action="pan-y"
		auto-rotate
		interaction-prompt="auto"
		style="width:100%; height:100%">
	</model-viewer>

</body>
</html>
